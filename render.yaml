services:
  - type: web
    name: proofpay
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/jobs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proofpay-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://proofpay.onrender.com
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_MOCK
        value: "false"
      - key: MODEL_ID
        value: gemini-3.8-flash
      - key: MODEL_FALLBACK_ID
        value: gemini-3.5-flash-lite
      - key: MANDATE_SIGNING_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

databases:
  - name: proofpay-db
    databaseName: proofpay
    user: proofpay_user
    plan: free
    region: oregon

