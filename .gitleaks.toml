[extend]
useDefault = true

[allowlist]
description = "Ignore build artifacts, tests, and mock HMAC secret"
paths = [
  '''.next/.*''',
  '''node_modules/.*''',
  '''test/.*''',
  '''tests/.*''',
  '''eval/fixtures/.*'''
]
regexes = [
  '''test_signing_secret_at_least_32_characters_long_12345''',
]

